options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/340263268846/secrets/nvd-api-key/versions/latest
      env: NVD_API_KEY

steps:
  # 0) Prepare /workspace
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: prepare-workspace
    entrypoint: sh
    args:
      - -c
      - |
        set -e

        : "${_SERVICE:?_SERVICE is required (from trigger)}"
        : "${_REGION:?_REGION is required (from trigger)}"
        : "${_AR_REPO:?_AR_REPO is required (from trigger)}"
        : "${_CLUSTER:?_CLUSTER is required (from trigger)}"
        : "${_CLUSTER_REGION:?_CLUSTER_REGION is required (from trigger)}"
        : "${_NAMESPACE:?_NAMESPACE is required (from trigger)}"

        mkdir -p /workspace/reports/dependency-check
        mkdir -p /workspace/odc-data
        chmod -R 777 /workspace/reports /workspace/odc-data

  # 1) Build & test
  - name: maven:3.9-eclipse-temurin-17
    id: build-test
    entrypoint: sh
    args: ["-c", "mvn -B clean test"]

  # 2) SAST (STRICT)
  - name: returntocorp/semgrep:1.66.0
    id: sast
    entrypoint: sh
    args: ["-c", "semgrep --config=p/java --severity=ERROR ."]

  # 3) Restore NVD cache
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: restore-odc-cache
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        gsutil -m rsync -r gs://${PROJECT_ID}-odc-cache /workspace/odc-data || true

  # 4) SCA (STRICT)
  - name: owasp/dependency-check:12.2.0
    id: sca
    entrypoint: sh
    secretEnv: ["NVD_API_KEY"]
    args:
      - -c
      - |
        set -e
        /usr/share/dependency-check/bin/dependency-check.sh \
          --project "${_SERVICE}" \
          --scan /workspace \
          --format JSON \
          --out /workspace/reports/dependency-check \
          --data /workspace/odc-data \
          --nvdApiKey "$$NVD_API_KEY" \
          --failOnCVSS "${_FAIL_ON_CVSS}"

  # 5) Save updated cache
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: save-odc-cache
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        gsutil -m rsync -r /workspace/odc-data gs://${PROJECT_ID}-odc-cache

  # 6) Secret scan
  - name: zricethezav/gitleaks:v8.18.4
    id: secret-scan
    entrypoint: sh
    args: ["-c", "gitleaks detect --source . --no-git --verbose"]

  # 7) K8s policy
  - name: openpolicyagent/conftest:v0.46.0
    id: k8s-policy
    entrypoint: sh
    args: ["-c", "conftest test k8s --policy policies/conftest"]

  # 8) Build & push image
  - name: gcr.io/cloud-builders/docker
    id: docker-build
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"

  # 9) Blue/Green deploy
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: bluegreen-deploy
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail
        APP="${_SERVICE}"
        NAMESPACE="${_NAMESPACE}"
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"

        gcloud container clusters get-credentials "${_CLUSTER}" --region "${_CLUSTER_REGION}"

        ACTIVE_COLOR=$(kubectl -n "${NAMESPACE}" get svc "${APP}" -o jsonpath='{.spec.selector.color}' || echo blue)
        [ "${ACTIVE_COLOR}" = "blue" ] && INACTIVE_COLOR="green" || INACTIVE_COLOR="blue"

        kubectl -n "${NAMESPACE}" set image deployment/${APP}-${INACTIVE_COLOR} app="${IMAGE}"
        kubectl -n "${NAMESPACE}" rollout status deployment/${APP}-${INACTIVE_COLOR} --timeout=5m

        kubectl -n "${NAMESPACE}" patch svc "${APP}" \
          -p '{"spec":{"selector":{"app":"'"${APP}"'","color":"'"${INACTIVE_COLOR}"'"}}}'

  # 10) Ensure README exists
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: ensure-reports-exist
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        if [ ! -f /workspace/reports/README.txt ]; then
          echo "No security reports generated for this build." > /workspace/reports/README.txt
          echo "{}" > /workspace/reports//dependency-check/README.json
        fi

artifacts:
  objects:
    location: "gs://${PROJECT_ID}-cicd-reports/${BUILD_ID}/release"
    paths:
      - "reports/README.txt"
      - "reports/dependency-check/*.json"


images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"