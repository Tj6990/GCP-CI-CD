options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: "sample-api"

availableSecrets:
  secretManager:
    - versionName: projects/340263268846/secrets/nvd-api-key/versions/latest
      env: NVD_API_KEY

steps:
  # --- Restore Dependency-Check cache (CVE DB + analyzers data) ---
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: restore-odc-cache
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        mkdir -p /tmp/odc-data
        echo "Restoring ODC cache (if exists) from gs://$PROJECT_ID-odc-cache ..."
        gsutil -m rsync -r gs://$PROJECT_ID-odc-cache /tmp/odc-data || true

  # --- OWASP Dependency-Check (PR-safe) ---
  - name: "owasp/dependency-check:latest"
    id: "sca"
    entrypoint: "sh"
    secretEnv:
      - NVD_API_KEY
    args:
      - "-c"
      - |
        set -e

        mkdir -p /tmp/reports/dependency-check
        mkdir -p /tmp/odc-data

        # If cache is present, use PR-safe mode: no updates (fast + stable)
        # '--noupdate' disables automatic updating of NVD-CVE and other hosted sources. [1](https://dependency-check.github.io/DependencyCheck/dependency-check-cli/arguments.html)
        if ls /tmp/odc-data >/dev/null 2>&1 && [ "$(ls -A /tmp/odc-data | wc -l)" -gt 0 ]; then
          echo "ODC cache detected. Running PR scan with --noupdate (no external NVD calls)."
          /usr/share/dependency-check/bin/dependency-check.sh \
            --project "${_SERVICE}" \
            --scan /workspace \
            --format JSON \
            --out /tmp/reports/dependency-check \
            --noupdate
        else
          # Bootstrap case: cache empty. Attempt one-time update using API key (best-effort).
          # CI environments may hit NVD rate limits or transient failures; caching is recommended. [2](https://github.com/dependency-check/DependencyCheck/blob/main/README.md)[3](https://outlook.office365.com/owa/?ItemID=AAMkADZlNWYxNmNhLTQ4OGUtNGI1MS05YThjLTJjZmYzYjkzOTZiOQBGAAAAAAAaQA41co7eR7HFZXDql0hsBwBdTm3VilZQRK0YCdWaGlzAAAAAAAEMAABdTm3VilZQRK0YCdWaGlzAAAKs7SxAAAA%3d&exvsurl=1&viewmodel=ReadMessageItem)
          echo "ODC cache NOT found. Bootstrapping once using NVD API key (best-effort)."
          echo "NVD_API_KEY length = $${#NVD_API_KEY}"
          /usr/share/dependency-check/bin/dependency-check.sh \
            --project "${_SERVICE}" \
            --scan /workspace \
            --format JSON \
            --out /tmp/reports/dependency-check \
            --nvdApiKey "$$NVD_API_KEY" || true
        fi

  # --- Save cache back to GCS (so next PR is fast) ---
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: save-odc-cache
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        echo "Saving ODC cache to gs://$PROJECT_ID-odc-cache ..."
        gsutil -m rsync -r /tmp/odc-data gs://$PROJECT_ID-odc-cache || true

artifacts:
  objects:
    location: "gs://${PROJECT_ID}-cicd-reports/${BUILD_ID}/pr"
    paths:
      - "/tmp/reports/**"